name: Foundation

on:
  pull_request:
  push:
    branches: [main, 'app-builder-1/**']

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip check
      - run: python manage.py check && python manage.py test tests --verbosity 2
        env:
          GLOW_ENV: test
      - run: ruff check . && ruff format --check . && mypy
      - run: PYTHONPATH=. python -m unittest discover -s ../../packages/contracts/tests -v

  mobile:
    name: Mobile checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPO_OFFLINE: '1'
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --global npm@11.9.0
        working-directory: ${{ github.workspace }}
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: packages/contracts
      - run: npm run check
        working-directory: packages/contracts
      - run: npm run check && npm run check:expo
      - run: npm run export:development
      - name: Install Chromium for rendered fixture checks
        run: npx playwright install --with-deps chromium
      - name: Render and exercise account onboarding
        run: npm run test:rendered
      - name: Save empty-form layout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p04-empty-form-layout
          path: apps/mobile/.work/rendered-results/**/account-320-enlarged.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  smoke:
    name: API mobile smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: python -m pip install --require-hashes -r services/api/requirements.lock
      - run: npm install --global npm@11.9.0
      - run: npm ci --ignore-scripts
        working-directory: apps/mobile
      - run: node scripts/smoke.mjs && node --test scripts/smoke.test.mjs
        env:
          GLOW_SMOKE_PYTHON: python

  artifact:
    name: API artifact checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned API image
        run: |
          mkdir -p .work
          docker build --platform linux/amd64 --tag glow-api:ci --iidfile .work/api-image-id .
      - name: Inspect image, refuse unsafe modes, smoke loopback and terminate
        run: python3 scripts/container_smoke.py glow-api:ci
