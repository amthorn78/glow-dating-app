name: Foundation

on:
  pull_request:
  push:
    branches: [main, 'app-builder-1/**', 'app-planner-1/**', 'claude/**']

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the complete change using trusted base policy
        id: scope
        env:
          COMPARE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMPARE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          # Do not import or execute candidate Python before this decision.
          # First adoption, a new branch or missing policy conservatively runs all checks.
          policy_dir=$(mktemp -d "$RUNNER_TEMP/glow-scope.XXXXXX")
          policy_base="$COMPARE_BASE"
          # An earlier feature-branch commit is not a reviewed policy authority.
          if [ "$IS_PULL_REQUEST" != true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            policy_base=$(git rev-parse refs/remotes/origin/main 2>/dev/null || true)
          fi
          if [[ "$policy_base" =~ ^[0-9a-f]{40}$ ]] && git show "$policy_base:scripts/change_scope.py" > "$policy_dir/change_scope.py"; then
            args=(--base "$COMPARE_BASE" --head "$COMPARE_HEAD" --github-output "$GITHUB_OUTPUT")
            if [ "$IS_PULL_REQUEST" = true ]; then args+=(--merge-base); fi
            python3 -I "$policy_dir/change_scope.py" "${args[@]}"
          else
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'Full checks: trusted comparison policy unavailable.'
          fi

  api:
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
    name: API checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Test candidate scope policy after trusted classification
        working-directory: ${{ github.workspace }}
        run: python -I -m unittest discover -s scripts -p 'test_change_scope.py' -v
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip check
      - run: python manage.py check && python manage.py test tests --verbosity 2
        env:
          GLOW_ENV: test
      - run: ruff check . && ruff format --check . && mypy
      - run: PYTHONPATH=. python -m unittest discover -s ../../packages/contracts/tests -v

  mobile:
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
    name: Mobile checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPO_OFFLINE: '1'
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --global npm@11.9.0
        working-directory: ${{ github.workspace }}
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: packages/contracts
      - run: npm run check
        working-directory: packages/contracts
      - run: npm run check && npm run check:expo
      - run: npm run export:development
      - name: Install Chromium for rendered fixture checks
        run: npx playwright install --with-deps chromium
      - name: Render and exercise account onboarding
        run: npm run test:rendered
      - name: Save empty-form layout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p04-empty-form-layout
          path: |
            apps/mobile/.work/rendered-results/**/account-320-enlarged.png
            apps/mobile/.work/rendered-results/**/profile-empty-320-enlarged.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  smoke:
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
    name: API mobile smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: python -m pip install --require-hashes -r services/api/requirements.lock
      - run: npm install --global npm@11.9.0
      - run: npm ci --ignore-scripts
        working-directory: apps/mobile
      - run: node scripts/smoke.mjs && node --test scripts/smoke.test.mjs
        env:
          GLOW_SMOKE_PYTHON: python

  artifact:
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
    name: API artifact checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned API image
        run: |
          mkdir -p .work
          docker build --platform linux/amd64 --tag glow-api:ci --iidfile .work/api-image-id .
      - name: Inspect image, refuse unsafe modes, smoke loopback and terminate
        run: python3 scripts/container_smoke.py glow-api:ci

  proof:
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
    name: Stream proof checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: proofs/stream-chat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --global npm@11.9.0
        working-directory: ${{ github.workspace }}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip check
      - run: npm ci --ignore-scripts
      # The offline tests run in a clean environment; they assert that no STREAM_* variable
      # is present, and this job is given none (no secret is needed or referenced).
      - run: env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 python -m unittest discover -s tests -t .
      - run: ruff check . && ruff format --check . && mypy
      - run: for f in client/*.cjs; do node --check "$f"; done
      - run: python checks/run_plan.py

  database:
    needs: scope
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
    name: Database proof checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: proofs/postgres-ordering
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip check
      # The offline tests need no database. They run in a clean environment and show the
      # settings' refusals of forbidden connection names and of every PG* name.
      - run: env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 python -m unittest discover -s tests -t . -v
      - run: ruff check . && ruff format --check . && mypy
      # P06.DB (OD-17; brief D3): a disposable PostgreSQL 17.11 that exists only in this job,
      # on loopback, with credentials generated here. No repository secret, no PG* or
      # DATABASE_URL name, no docker inspect, and nothing that prints a connection option.
      # The run's marker (brief D1 and D3 item 5; DM-10 2.3 and 2.4): the database's comment
      # is set to it, and every proof command refuses a database without it. Each step that
      # needs it reads it from the job's protected temporary directory into PROOF_DB_MARKER
      # for its own commands; it never goes through $GITHUB_ENV or a step output.
      - name: Generate the disposable database's credentials (masked before anything prints)
        id: credentials
        shell: bash
        run: |
          set +x
          umask 077
          superuser_password=$(python -c 'import secrets; print(secrets.token_hex(24))')
          role_password=$(python -c 'import secrets; print(secrets.token_hex(24))')
          # The run's marker, and a different well-formed one that a step shows refused.
          # Neither is a credential; both are masked like the passwords (DM-10 2.4).
          marker=$(python -c 'import secrets; print(secrets.token_hex(16))')
          wrong_marker=$(python -c 'import secrets; print(secrets.token_hex(16))')
          echo "::add-mask::$superuser_password"
          echo "::add-mask::$role_password"
          echo "::add-mask::$marker"
          echo "::add-mask::$wrong_marker"
          test "$marker" != "$wrong_marker" || { echo "the two markers are equal; refusing"; exit 1; }
          dir=$(mktemp -d "$RUNNER_TEMP/glow-proof-db.XXXXXX")
          printf '%s\n' "$superuser_password" > "$dir/superuser-password"
          printf "CREATE ROLE glow_proof LOGIN PASSWORD '%s' NOSUPERUSER NOCREATEDB NOCREATEROLE;\nCREATE DATABASE glow_proof OWNER glow_proof;\nCOMMENT ON DATABASE glow_proof IS 'glow-ordering-proof:%s';\n" "$role_password" "$marker" > "$dir/create-role.sql"
          printf '127.0.0.1:5433:glow_proof:glow_proof:%s\n' "$role_password" > "$dir/passfile"
          printf '%s\n' "$marker" > "$dir/marker"
          printf '%s\n' "$wrong_marker" > "$dir/wrong-marker"
          chmod 600 "$dir"/*
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "container=glow-proof-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "credentials generated into a directory readable only by this job's user"
      - name: Start PostgreSQL 17.11 (official image pinned by digest) on loopback with commit timestamps
        env:
          DIR: ${{ steps.credentials.outputs.dir }}
          CONTAINER: ${{ steps.credentials.outputs.container }}
          IMAGE: postgres@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        run: |
          docker pull "$IMAGE"
          docker run --detach --name "$CONTAINER" \
            --publish 127.0.0.1:5433:5432 \
            --mount "type=bind,source=$DIR/superuser-password,target=/run/secrets/superuser-password,readonly" \
            --env POSTGRES_PASSWORD_FILE=/run/secrets/superuser-password \
            "$IMAGE" -c track_commit_timestamp=on
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec "$CONTAINER" pg_isready -q -h 127.0.0.1 -p 5432 -U postgres; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1 || { echo "PostgreSQL did not become ready within 60 s"; exit 1; }
          docker exec "$CONTAINER" pg_isready -h 127.0.0.1 -p 5432 -U postgres
      - name: Create the non-superuser proof role and its database, with the run's marker as its comment
        env:
          DIR: ${{ steps.credentials.outputs.dir }}
          CONTAINER: ${{ steps.credentials.outputs.container }}
        run: |
          # psql inside the container uses its Unix socket (trust); the statement is read from
          # the file and its output is kept out of the log, because it could carry the statement.
          docker exec -i "$CONTAINER" psql -q -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < "$DIR/create-role.sql" > "$DIR/create-role.log" 2>&1 \
            || { echo "role creation failed (diagnostics withheld)"; exit 1; }
          rm -f "$DIR/create-role.sql"
          echo "role glow_proof (NOSUPERUSER) and database glow_proof created, with the run's marker as its comment"
      - name: Show that a wrong marker is refused and leaves the proof's database unchanged
        shell: bash
        env:
          DIR: ${{ steps.credentials.outputs.dir }}
          CONTAINER: ${{ steps.credentials.outputs.container }}
        run: |
          # DM-10 2.3, with the check in DM-11's words: as the superuser inside the container,
          # in the proof's database (never postgres), count pg_class rows per schema before
          # and after a migrate whose marker is well formed but not the run's.
          in_proof_db() {
            docker exec "$CONTAINER" psql -X -q -At -F ' ' -v ON_ERROR_STOP=1 -U postgres -d glow_proof -c "$1"
          }
          per_schema="SELECT n.nspname, count(c.oid) FROM pg_catalog.pg_namespace AS n LEFT JOIN pg_catalog.pg_class AS c ON c.relnamespace = n.oid GROUP BY n.nspname ORDER BY n.nspname"
          outside_pg="SELECT count(c.oid) FROM pg_catalog.pg_class AS c JOIN pg_catalog.pg_namespace AS n ON c.relnamespace = n.oid WHERE n.nspname <> 'information_schema' AND NOT starts_with(n.nspname, 'pg_')"
          in_proof_db "$per_schema" > "$DIR/relations-before.txt"
          outside_before=$(in_proof_db "$outside_pg")
          set +e
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 \
            PROOF_DB_HOST=127.0.0.1 PROOF_DB_PORT=5433 PROOF_DB_NAME=glow_proof PROOF_DB_USER=glow_proof \
            PROOF_DB_PASSFILE="$DIR/passfile" PROOF_DB_MARKER="$(cat "$DIR/wrong-marker")" \
            DJANGO_SETTINGS_MODULE=glow_ordering_proof.settings \
            python -m django migrate --verbosity 1 > "$DIR/wrong-marker.log" 2>&1
          status=$?
          set -e
          in_proof_db "$per_schema" > "$DIR/relations-after.txt"
          outside_after=$(in_proof_db "$outside_pg")
          no_ledger=$(in_proof_db "SELECT to_regclass('public.django_migrations') IS NULL")
          echo "relations per schema in the proof's database, before the wrong-marker migrate:"
          sed 's/^/  /' "$DIR/relations-before.txt"
          echo "relations per schema in the proof's database, after the wrong-marker migrate:"
          sed 's/^/  /' "$DIR/relations-after.txt"
          echo "relations outside information_schema and the pg_ schemas: $outside_before before, $outside_after after"
          echo "to_regclass('public.django_migrations') IS NULL after: $no_ledger"
          echo "wrong-marker migrate exit status: $status"
          refusal=$(grep -m 1 -F 'RefusedDatabase: refusing this database' "$DIR/wrong-marker.log" || true)
          fail=0
          if [ "$status" -eq 0 ]; then echo "FAIL: migrate with a wrong marker exited 0"; fail=1; fi
          if [ -n "$refusal" ]; then
            echo "refusal: $refusal"
          else
            echo "FAIL: the refusal message is missing (diagnostics withheld)"; fail=1
          fi
          cmp -s "$DIR/relations-before.txt" "$DIR/relations-after.txt" \
            || { echo "FAIL: a schema's relation count changed"; fail=1; }
          if [ "$outside_before" != 0 ] || [ "$outside_after" != 0 ]; then
            echo "FAIL: a relation exists outside information_schema and the pg_ schemas"; fail=1
          fi
          if [ "$no_ledger" != t ]; then echo "FAIL: django_migrations exists"; fail=1; fi
          rm -f "$DIR/wrong-marker" "$DIR/wrong-marker.log" "$DIR/relations-before.txt" "$DIR/relations-after.txt"
          test "$fail" = 0
          echo "a wrong marker was refused, and the proof's database is unchanged and holds no table"
      - name: Show that dbshell is refused under the proof's settings, before any connection
        shell: bash
        env:
          DIR: ${{ steps.credentials.outputs.dir }}
        run: |
          # P06.DB's carried item 6 (DM-12): the proof's own dbshell refuses with the marker's
          # refusal and opens no connection, so psql never starts with the proof's settings.
          set +e
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 \
            PROOF_DB_HOST=127.0.0.1 PROOF_DB_PORT=5433 PROOF_DB_NAME=glow_proof PROOF_DB_USER=glow_proof \
            PROOF_DB_PASSFILE="$DIR/passfile" PROOF_DB_MARKER="$(cat "$DIR/marker")" \
            DJANGO_SETTINGS_MODULE=glow_ordering_proof.settings \
            python -m django dbshell < /dev/null > "$DIR/dbshell.log" 2>&1
          status=$?
          set -e
          refusal=$(grep -m 1 -F 'RefusedDatabase: refusing dbshell' "$DIR/dbshell.log" || true)
          rm -f "$DIR/dbshell.log"
          echo "dbshell exit status: $status"
          if [ "$status" -eq 0 ]; then echo "FAIL: dbshell exited 0"; exit 1; fi
          if [ -z "$refusal" ]; then echo "FAIL: the dbshell refusal is missing (diagnostics withheld)"; exit 1; fi
          echo "refusal: $refusal"
      - name: Apply the reviewed migrations from zero, check them against the models, record the server
        env:
          DIR: ${{ steps.credentials.outputs.dir }}
        run: |
          proof() {
            env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 \
              PROOF_DB_HOST=127.0.0.1 PROOF_DB_PORT=5433 PROOF_DB_NAME=glow_proof PROOF_DB_USER=glow_proof \
              PROOF_DB_PASSFILE="$DIR/passfile" PROOF_DB_MARKER="$(cat "$DIR/marker")" \
              DJANGO_SETTINGS_MODULE=glow_ordering_proof.settings "$@"
          }
          proof python -m django migrate --verbosity 1
          proof python -m django makemigrations --check --dry-run
          proof python -m glow_ordering_proof facts
      - name: Run the suite on both subjects (the reference design and the app's adapter), then the delivery phase
        env:
          DIR: ${{ steps.credentials.outputs.dir }}
        run: |
          mkdir -p .work
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 \
            PROOF_DB_HOST=127.0.0.1 PROOF_DB_PORT=5433 PROOF_DB_NAME=glow_proof PROOF_DB_USER=glow_proof \
            PROOF_DB_PASSFILE="$DIR/passfile" PROOF_DB_MARKER="$(cat "$DIR/marker")" \
            DJANGO_SETTINGS_MODULE=glow_ordering_proof.settings \
            python -m glow_ordering_proof run --seed 20260929 --results .work/results.json
      - name: Show that a second run on the used database is refused before it writes
        shell: bash
        env:
          DIR: ${{ steps.credentials.outputs.dir }}
          CONTAINER: ${{ steps.credentials.outputs.container }}
        run: |
          # P06.DB's carried item 1 (R2): run refuses a database whose proof tables or app
          # accounts already hold rows; the counts, read as the superuser inside the
          # container, are unchanged by the refused run.
          counts() {
            docker exec "$CONTAINER" psql -X -q -At -v ON_ERROR_STOP=1 -U postgres -d glow_proof -c \
              "SELECT (SELECT count(*) FROM proof_writer_log) || ' ' || (SELECT count(*) FROM proof_adapter_call) || ' ' || (SELECT count(*) FROM proof_world) || ' ' || (SELECT count(*) FROM glow_persistence_appaccount) || ' ' || (SELECT count(*) FROM glow_persistence_outboxevent)"
          }
          before=$(counts)
          set +e
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 \
            PROOF_DB_HOST=127.0.0.1 PROOF_DB_PORT=5433 PROOF_DB_NAME=glow_proof PROOF_DB_USER=glow_proof \
            PROOF_DB_PASSFILE="$DIR/passfile" PROOF_DB_MARKER="$(cat "$DIR/marker")" \
            DJANGO_SETTINGS_MODULE=glow_ordering_proof.settings \
            python -m glow_ordering_proof run --seed 20260929 > "$DIR/rerun.log" 2>&1
          status=$?
          set -e
          after=$(counts)
          refusal=$(grep -m 1 -F 'refusing a used database' "$DIR/rerun.log" || true)
          rm -f "$DIR/rerun.log"
          echo "rows (proof log, adapter calls, worlds, app accounts, outbox events) before: $before; after: $after"
          echo "second run exit status: $status"
          if [ "$status" -eq 0 ]; then echo "FAIL: a second run on the used database exited 0"; exit 1; fi
          if [ -z "$refusal" ]; then echo "FAIL: the refusal is missing (diagnostics withheld)"; exit 1; fi
          if [ "$before" != "$after" ]; then echo "FAIL: the refused run changed the database"; exit 1; fi
          echo "refusal: $refusal"
      - name: Save the results table's JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p06-db-proof-results
          path: proofs/postgres-ordering/.work/results.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the disposable database, its credential files and the marker files
        if: always()
        env:
          DIR: ${{ steps.credentials.outputs.dir }}
          CONTAINER: ${{ steps.credentials.outputs.container }}
        run: |
          if [ -n "$CONTAINER" ] && docker rm --force --volumes "$CONTAINER" >/dev/null 2>&1; then
            echo "container removed: $CONTAINER"
          else
            echo "no container to remove"
          fi
          if [ -n "$DIR" ]; then rm -rf "$DIR"; echo "credential and marker files removed"; fi
          remaining=$(docker ps --all --filter "name=glow-proof-db" --format '{{.Names}}')
          test -z "$remaining" || { echo "a proof container remains: $remaining"; exit 1; }
          echo "no proof container remains"

  gate:
    name: Foundation gate
    if: always()
    needs: [scope, api, mobile, smoke, artifact, proof, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful checks or an explicit documentation exemption
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          assert results["scope"]["result"] == "success", "Change classification failed"
          full = results["scope"]["outputs"].get("full")
          assert full in {"true", "false"}, "Missing classification output"
          expected = "success" if full == "true" else "skipped"
          for job in ("api", "mobile", "smoke", "artifact", "proof", "database"):
              assert results[job]["result"] == expected, f"Unexpected {job} result"
          print("Application checks passed" if full == "true" else "Ordinary documentation: application jobs intentionally skipped")
          PYTHON
