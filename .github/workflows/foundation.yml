name: Foundation

on:
  pull_request:
  push:
    branches: [main, 'app-builder-1/**']

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip check
      - run: python manage.py check && python manage.py test tests --verbosity 2
        env:
          GLOW_ENV: test
      - run: ruff check . && ruff format --check . && mypy
      - run: PYTHONPATH=. python -m unittest discover -s ../../packages/contracts/tests -v

  mobile:
    name: Mobile checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPO_OFFLINE: '1'
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check && npm run check:expo
      - run: npm run export:development

  smoke:
    name: API mobile smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: python -m pip install --require-hashes -r services/api/requirements.lock
      - run: node scripts/smoke.mjs && node --test scripts/smoke.test.mjs
        env:
          GLOW_SMOKE_PYTHON: python
