[project]
name = "glow-stream-chat-proof"
version = "0.0.0"
description = "P06.1 sandbox proof of Stream Chat permissions (synthetic users only)"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["glow_stream_proof", "tests"]

[[tool.mypy.overrides]]
module = ["getstream", "getstream.*"]
ignore_missing_imports = true
