[project]
name = "glow-postgres-ordering-proof"
version = "0.0.0"
description = "P06.DB disposable-PostgreSQL proof of send-versus-revocation ordering and a minimal sign-in"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["glow_ordering_proof", "tests"]

[[tool.mypy.overrides]]
module = ["django.*", "glow_persistence.*", "psycopg.*", "glow_chat.*", "glow_domain.*"]
ignore_missing_imports = true
